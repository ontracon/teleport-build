name: Build Teleport and client tools
run-name: Build and release Teleport ${{ inputs.tag }} build ${{ github.run_number }}.${{ github.run_attempt }} with Zitadel and client tools

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Linux build and release runner labels as a JSON array
        type: string
        required: true
        default: '["ubuntu-24.04"]'
      tag:
        description: Upstream release tag matching integration/upstream.commit
        type: string
        required: true
        default: v18.10.0
      build_jobs:
        description: Go and Rust compiler concurrency
        type: choice
        default: '2'
        options:
          - '1'
          - '2'
          - '4'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve upstream tag and toolchain versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.versions.outputs.commit }}
      version: ${{ steps.versions.outputs.version }}
      distribution_version: ${{ steps.versions.outputs.distribution_version }}
      go: ${{ steps.versions.outputs.go }}
      rust: ${{ steps.versions.outputs.rust }}
    env:
      TELEPORT_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out build repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Test release validation
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/build -p 'test_*.py' -v

      - name: Validate Teleport release tag
        run: |
          python3 -c 'import os, re; tag = os.environ["TELEPORT_TAG"]; assert re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", tag), "Expected a stable release tag such as v18.10.0"'

      - name: Check out requested Teleport tag
        uses: actions/checkout@v7.0.1
        with:
          repository: gravitational/teleport
          ref: refs/tags/${{ inputs.tag }}
          path: teleport-source
          persist-credentials: false

      - name: Resolve source and required versions
        id: versions
        working-directory: teleport-source
        run: |
          teleport_commit="$(git rev-parse "refs/tags/${TELEPORT_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$teleport_commit"
          supported_commit="$(cat "$GITHUB_WORKSPACE/integration/upstream.commit")"
          if [[ "$teleport_commit" != "$supported_commit" ]]; then
            echo 'The requested tag does not match integration/upstream.commit; update and verify the patch series before releasing it.' >&2
            exit 1
          fi
          echo "commit=$teleport_commit" >> "$GITHUB_OUTPUT"
          echo "version=${TELEPORT_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "distribution_version=${TELEPORT_TAG#v}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "go=$(awk '$1 == "GOLANG_VERSION" { sub(/^go/, "", $3); print $3 }' build.assets/versions.mk)" >> "$GITHUB_OUTPUT"
          echo "rust=$(awk '$1 == "channel" { gsub(/"/, "", $3); print $3 }' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

  build:
    name: Patched Linux build and integration tests
    needs: prepare
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 360
    env:
      TELEPORT_VERSION: ${{ needs.prepare.outputs.version }}
      TELEPORT_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      TELEPORT_COMMIT: ${{ needs.prepare.outputs.commit }}
      BUILD_JOBS: ${{ inputs.build_jobs || '2' }}
      BUILD_PLATFORM: linux/amd64
      SOURCE_REVISION: ${{ github.sha }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Free unused host toolchains for the Docker build
        if: runner.environment == 'github-hosted'
        run: |
          # Linux compilation and tests use the pinned container toolchains.
          # Actions' embedded Node runtime and system Python remain available.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell
          sudo apt-get clean
          df -h /
          df -i /

      - name: Verify Linux amd64 runner and Docker access
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          make --version
          python3 --version
          docker version
          docker buildx version
          case "$(docker info --format '{{.OSType}}/{{.Architecture}}')" in
            linux/amd64|linux/x86_64) ;;
            *) echo 'A Linux amd64 Docker engine is required.' >&2; exit 1 ;;
          esac

      - name: Build verified artifacts and production image together
        run: make release-build

      - name: Install Helm for the production image smoke test
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.6

      - name: Test production entrypoint and official chart compatibility
        run: |
          mkdir -p tests/build/test-results
          make test-runtime 2>&1 | tee tests/build/test-results/runtime-smoke.log

      - name: Report Linux build storage
        if: always()
        run: |
          mkdir -p tests/build/test-results
          {
            df -h / || true
            df -i / || true
            docker system df || true
            docker buildx du || true
          } 2>&1 | tee tests/build/test-results/host-disk-usage.txt

      - name: Upload exported test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: teleport-linux-amd64-test-reports
          path: |
            dist/linux-amd64/test-results/
            tests/build/test-results/host-disk-usage.txt
            tests/build/test-results/runtime-smoke.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify exported artifacts and create archive
        id: package
        run: |
          cd dist/linux-amd64
          test -f test-results/PASSED
          sha256sum --check SHA256SUMS
          version="$(python3 "$GITHUB_WORKSPACE/build/verify-release.py" "$PWD")"
          archive="teleport-${version}-linux-amd64.tar.gz"
          tar -czf "../${archive}" bin LICENSE SHA256SUMS manifest.json test-results
          cd ..
          sha256sum "${archive}" > "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Save the tested production image for publication
        run: |
          image="teleport-zitadel:${TELEPORT_VERSION//+/-}"
          docker image inspect --format '{{.Id}}' "$image" > dist/runtime-image-id.txt
          docker save "$image" | gzip -1 > dist/teleport-runtime-linux-amd64.tar.gz
          (cd dist && sha256sum teleport-runtime-linux-amd64.tar.gz > teleport-runtime-linux-amd64.tar.gz.sha256)

      - name: Upload tested production image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: teleport-runtime-linux-amd64
          path: |
            dist/teleport-runtime-linux-amd64.tar.gz
            dist/teleport-runtime-linux-amd64.tar.gz.sha256
            dist/runtime-image-id.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload tested build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: teleport-linux-amd64
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload mirror-compatible archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: teleport-mirror-linux-amd64
          path: dist/linux-amd64/mirror/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  tsh:
    name: Native client tools (${{ matrix.os }}/${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-2022
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: darwin
            arch: amd64
            runner: macos-15-intel
    env:
      TELEPORT_TAG: ${{ inputs.tag }}
      TELEPORT_VERSION: ${{ needs.prepare.outputs.distribution_version }}
      TELEPORT_COMMIT: ${{ needs.prepare.outputs.commit }}
      SOURCE_DIR: ${{ github.workspace }}/teleport-source
      CLIENT_OUT_DIR: ${{ github.workspace }}/dist/tsh-clients
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      BUILD_JOBS: ${{ inputs.build_jobs }}
      RUST_VERSION: ${{ needs.prepare.outputs.rust }}
      GOTOOLCHAIN: local
      FIDO2: 'off'
    steps:
      - name: Keep LF line endings for native build scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out build repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check out resolved Teleport source
        uses: actions/checkout@v7.0.1
        with:
          repository: gravitational/teleport
          ref: ${{ needs.prepare.outputs.commit }}
          path: teleport-source
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ needs.prepare.outputs.go }}
          cache-dependency-path: teleport-source/go.sum

      - name: Install Windows GNU compiler and native dependencies
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf

      - name: Configure Windows compiler and pinned GNU Rust toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          Add-Content $env:GITHUB_PATH "$env:MSYS2_LOCATION\usr\bin"
          Add-Content $env:GITHUB_PATH "$env:MSYS2_LOCATION\mingw64\bin"
          Add-Content $env:GITHUB_ENV 'CC=gcc'
          Add-Content $env:GITHUB_ENV 'CXX=g++'
          Add-Content $env:GITHUB_ENV 'CMAKE_GENERATOR=Ninja'
          $toolchain = "$($env:RUST_VERSION)-x86_64-pc-windows-gnu"
          rustup toolchain install $toolchain --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_ENV "RUSTUP_TOOLCHAIN=$toolchain"

      - name: Install macOS native dependencies and pinned Rust toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          rustup toolchain install "$RUST_VERSION" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Build and verify native Windows clients
        if: runner.os == 'Windows'
        shell: pwsh
        run: python build/build-tsh-client.py

      - name: Build and verify native macOS clients
        if: runner.os == 'macOS'
        shell: bash
        run: python3 build/build-tsh-client.py

      - name: Upload native tsh archive and checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tsh-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/tsh-${{ needs.prepare.outputs.distribution_version }}-${{ matrix.os }}-${{ matrix.arch }}.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload verified macOS client binaries for the universal package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mirror-client-darwin-${{ matrix.arch }}
          path: dist/tsh-clients/darwin-${{ matrix.arch }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Package macOS host mirror archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 build/package-client-mirror.py --version "$TELEPORT_VERSION" --commit "$TELEPORT_COMMIT" \
            --darwin-host "$CLIENT_OUT_DIR/darwin-$TARGET_ARCH" --arch "$TARGET_ARCH" --output dist/mirror-darwin

      - name: Upload macOS host mirror archive
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: teleport-mirror-darwin-${{ matrix.arch }}
          path: dist/mirror-darwin/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Package Windows client mirror archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python build/package-client-mirror.py --version "$env:TELEPORT_VERSION" --commit "$env:TELEPORT_COMMIT" --windows "$env:CLIENT_OUT_DIR/windows-amd64" --output dist/mirror-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:SOURCE_DIR
          try {
            go run "$env:GITHUB_WORKSPACE/build/verify-client-mirror.go" "$env:GITHUB_WORKSPACE/dist/mirror-windows/teleport-v${env:TELEPORT_VERSION}-windows-amd64-bin.zip" "$env:RUNNER_TEMP/mirror-windows-extracted" "$env:TELEPORT_VERSION"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }

      - name: Upload Windows client mirror archive
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: teleport-mirror-windows-amd64
          path: dist/mirror-windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos_mirror:
    name: Package universal macOS client mirror archive
    needs: [prepare, tsh]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: gravitational/teleport
          ref: ${{ needs.prepare.outputs.commit }}
          path: teleport-source
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ needs.prepare.outputs.go }}
          cache-dependency-path: teleport-source/go.sum
      - uses: actions/download-artifact@v8.0.1
        with:
          name: mirror-client-darwin-amd64
          path: dist/mirror-clients/darwin-amd64
      - uses: actions/download-artifact@v8.0.1
        with:
          name: mirror-client-darwin-arm64
          path: dist/mirror-clients/darwin-arm64
      - name: Build and verify universal macOS package
        env:
          VERSION: ${{ needs.prepare.outputs.distribution_version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python3 build/package-client-mirror.py --version "$VERSION" --commit "$COMMIT" \
            --darwin-amd64 dist/mirror-clients/darwin-amd64 \
            --darwin-arm64 dist/mirror-clients/darwin-arm64 --output dist/mirror-macos
          cd teleport-source
          go run "$GITHUB_WORKSPACE/build/verify-client-mirror.go" \
            "$GITHUB_WORKSPACE/dist/mirror-macos/teleport-tools-${VERSION}.pkg" \
            "$RUNNER_TEMP/mirror-macos-extracted" "$VERSION"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: teleport-mirror-darwin-universal
          path: dist/mirror-macos/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish_azure_mirror:
    name: Publish release to Azure mirror
    needs: [prepare, release]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-azure-mirror.yml
    with:
      release_tag: v${{ needs.prepare.outputs.distribution_version }}
    secrets: inherit

  release:
    name: Publish tested image and release assets
    needs: [prepare, build, tsh, macos_mirror]
    runs-on: ${{ fromJSON(inputs.runner) }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      packages: write
    env:
      TELEPORT_TAG: ${{ inputs.tag }}
      TELEPORT_VERSION: ${{ needs.prepare.outputs.version }}
      TELEPORT_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_BUILD: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Check out image publication helper
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Ensure GitHub CLI is available
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gh
          fi

      - name: Download Linux release assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: teleport-linux-amd64
          path: dist

      - name: Download native client release assets
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: tsh-*
          merge-multiple: true
          path: dist

      - name: Download mirror-compatible archive
        uses: actions/download-artifact@v8.0.1
        with:
          name: teleport-mirror-linux-amd64
          path: dist/mirror

      - name: Download Windows mirror archive
        uses: actions/download-artifact@v8.0.1
        with:
          name: teleport-mirror-windows-amd64
          path: dist/mirror

      - name: Download macOS mirror package
        uses: actions/download-artifact@v8.0.1
        with:
          name: teleport-mirror-darwin-universal
          path: dist/mirror

      - name: Download macOS amd64 host mirror archive
        uses: actions/download-artifact@v8.0.1
        with:
          name: teleport-mirror-darwin-amd64
          path: dist/mirror

      - name: Download macOS arm64 host mirror archive
        uses: actions/download-artifact@v8.0.1
        with:
          name: teleport-mirror-darwin-arm64
          path: dist/mirror

      - name: Download the tested production image
        uses: actions/download-artifact@v8.0.1
        with:
          name: teleport-runtime-linux-amd64
          path: dist/runtime

      - name: Publish the tested production image to GHCR
        id: image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          (cd dist/runtime && sha256sum --check teleport-runtime-linux-amd64.tar.gz.sha256)
          docker load --input dist/runtime/teleport-runtime-linux-amd64.tar.gz
          RUNTIME_IMAGE_ID="$(< dist/runtime/runtime-image-id.txt)"
          export RUNTIME_IMAGE_ID
          # Do not leave registry credentials on a persistent release runner.
          DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/teleport-ghcr.XXXXXX")"
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          bash build/publish-runtime.sh

      - name: Create release and upload tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: teleport-${{ needs.prepare.outputs.distribution_version }}-linux-amd64.tar.gz
          CONTAINER_IMAGE: ${{ steps.image.outputs.image }}
          CONTAINER_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -f "dist/$ARCHIVE"
          (cd dist && sha256sum --check "$ARCHIVE.sha256")
          archives=("dist/$ARCHIVE")
          distribution_version="${TELEPORT_VERSION}-${RELEASE_BUILD}"
          for suffix in windows-amd64.zip darwin-arm64.tar.gz darwin-amd64.tar.gz; do
            asset="tsh-${distribution_version}-${suffix}"
            test -f "dist/$asset"
            (cd dist && sha256sum --check "$asset.sha256")
            archives+=("dist/$asset")
          done
          release_assets=()
          for archive in "${archives[@]}"; do
            release_assets+=("$archive" "$archive.sha256")
          done
          for mirror_archive in "teleport-v${distribution_version}-linux-amd64-bin.tar.gz" \
              "teleport-v${distribution_version}-windows-amd64-bin.zip" \
              "teleport-v${distribution_version}-darwin-amd64-bin.tar.gz" \
              "teleport-v${distribution_version}-darwin-arm64-bin.tar.gz" \
              "teleport-tools-${distribution_version}.pkg"; do
            (cd dist/mirror && sha256sum --check "${mirror_archive}.sha256")
            release_assets+=("dist/mirror/$mirror_archive" "dist/mirror/$mirror_archive.sha256")
          done
          notes_file="$RUNNER_TEMP/teleport-release-notes.md"
          python3 - <<'PY' > "$notes_file"
          import os
          print(f"Teleport {os.environ['TELEPORT_TAG']} built from pinned Community source with the custom Zitadel OIDC integration for linux/amd64.")
          print(f"\nUpstream source commit: `{os.environ['TELEPORT_COMMIT']}`.")
          print(f"Build repository commit: `{os.environ['GITHUB_SHA']}`.")
          print(f"Release build: `{os.environ['RELEASE_BUILD']}`.")
          print(f"Teleport binary version: `{os.environ['TELEPORT_VERSION']}-{os.environ['RELEASE_BUILD']}`.")
          print("\nIncludes all six binaries, embedded Web UI with Zitadel connector management and configurable account labels, LICENSE, manifest with integration source hashes, binary checksums, and passing upstream test reports. The shared build also runs adapter, Auth/Proxy bridge, and account-label tests. FIDO2 is disabled; PAM, BPF, and Rust Desktop support are included.")
          print("\nZitadel support is enabled by default in the Linux server. Configure a native Zitadel OIDC connector to use it.")
          image = os.environ['CONTAINER_IMAGE']
          digest = os.environ['CONTAINER_DIGEST']
          repository, image_tag = image.rsplit(':', 1)
          print(f"\nProduction container (linux/amd64): `{image}`.")
          print(f"\nImage digest: `{repository}@{digest}`.")
          print("\nUse the official teleport-cluster chart matching the upstream Teleport version, with these values:")
          print(f'\n```yaml\nenterprise: false\nimage: {repository}\nteleportVersionOverride: "{image_tag}"\n```')
          print("\nThe production image follows the official image entrypoint and shutdown contract. Private GHCR packages require imagePullSecrets in the deployment namespace. The development lab image is not published.")
          print("\nSeparate tsh archives are included for Windows amd64 and macOS arm64/amd64. Clients are built natively with CGO, Rust RDP decoding, and PIV; macOS includes Touch ID. FIDO2 remains disabled. Each client passes executable header/build metadata checks and native version/help checks. Distribution signing and notarization are not configured.")
          print("\nMirror assets include the Linux amd64 agent archive, macOS amd64/arm64 host archives, the Windows amd64 client ZIP, and a universal macOS client package. The native macOS and Windows binaries are unsigned; the macOS package is not notarized. The macOS host binaries use minimal web assets and require separate enrollment testing.")
          print("\nLinux binaries are compiled in Debian Bookworm and require compatible runtime libraries. Verify each archive checksum before extracting.")
          PY
          release_tag="${TELEPORT_TAG}-${RELEASE_BUILD}"
          release_title="Teleport $TELEPORT_TAG with Zitadel and tsh clients (build $RELEASE_BUILD)"
          release_flags=(--target "$GITHUB_SHA" --title "$release_title" --notes-file "$notes_file")
          if [[ "${TELEPORT_VERSION%%+*}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$release_tag" \
            "${release_assets[@]}" \
            "${release_flags[@]}"
