kind: oidc
version: v3
metadata:
  name: new_zitadel_connector
  labels:
    zitadel/project-id: "<project-id>"
    # Organization receiving the user's role grant, which can differ from the project owner.
    zitadel/organization-id: "<role-grant-organization-id>"
    zitadel/transaction-ttl: "5m"
    # Display only: email (default), preferred_username, name, nickname, or a custom claim.
    zitadel/display-name-claim: "email"
    # Optional additional traits. Profile traits are included automatically.
    # zitadel/trait-claims: '["groups", "amr", "email_verified"]'
spec:
  provider: zitadel
  display: Zitadel
  issuer_url: "https://<zitadel-host>"
  client_id: "<client-id>"
  # Leave empty for None + PKCE. Set the Zitadel application secret for Basic.
  # For existing connectors, keep <existing-secret> to preserve the stored value.
  client_secret: ""
  redirect_url: "https://<cluster-url>/v1/webapi/oidc/callback"
  pkce_mode: enabled
  # Optional actual account name. Omit to keep the default subject-based username.
  # username_claim: preferred_username
  claims_to_roles:
    - claim: "urn:zitadel:iam:org:project:<project-id>:roles"
      value: "<zitadel-role-key>"
      roles: ["access"]
